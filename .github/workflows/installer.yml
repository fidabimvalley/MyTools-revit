name: Publish installer

# Keeps Install-MyTools.bat and Uninstall-MyTools.bat available as one-click downloads on the Releases page.
on:
  push:
    branches: [main]
    paths: ["installer/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Download **Install-MyTools.bat** below and double-click it (close Revit first). Works with Revit 2025 and 2026; pyRevit is not needed. If Windows warns about the file, click **More info → Run anyway**. To remove MyTools, use **Uninstall-MyTools.bat**."
          if gh release view installer >/dev/null 2>&1; then
            gh release upload installer installer/Install-MyTools.bat installer/Uninstall-MyTools.bat --clobber
            gh release edit installer --notes "$NOTES"
          else
            gh release create installer installer/Install-MyTools.bat installer/Uninstall-MyTools.bat --target "$GITHUB_SHA" \
              --title "MyTools for Revit installer" --notes "$NOTES"
          fi
